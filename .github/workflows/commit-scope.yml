name: Commit scope

# Enforces in CI what .githooks/pre-commit enforces locally (the hook can be skipped with --no-verify).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-scope:
    name: No commit mixes frontend/ and backend/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER^!"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          sh scripts/check-commit-scope.sh "$range"
